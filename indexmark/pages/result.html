<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result</title>
    <script>
        const theme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
    </script>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <div class="brand">

            <h1>Index Mark Calculator</h1>

            <p>Your Result</p>

        </div>

        <div class="card result-card">

            <div class="result-header">

                <h2 id="studentName">Loading...</h2>

                <p id="studentStream"></p>

            </div>

            <div class="index-box">

                <p class="index-title">
                    Your Index Mark
                </p>

                <h1 id="indexMark" class="big-index">
                    0.00
                </h1>
            </div>

            <h3 class="marks-title">
                Subject Marks
            </h3>

            <div id="marksContainer" class="marks-list">

            </div>

            <div class="btn-row">

                <button id="logoutBtn" class="btn btn-secondary">
                    Logout
                </button>

                <a href="index.html" class="btn btn-ghost">
                    Home
                </a>

            </div>

        </div>
    </div>

    </div>

    <script>

        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
            window.location.href = "login.html";
        }

        async function loadResult() {

            try {

                const res = await fetch(`/result/${studentId}`);

                const data = await res.json();

                if (!res.ok) {

                    alert(data.message);

                    return;

                }

                document.getElementById("studentName").textContent =
                    data.name;

                document.getElementById("studentStream").textContent =
                    "Stream : " + data.stream;

                document.getElementById("indexMark").textContent =
                    Number(data.index_mark).toFixed(2);

                const container =
                    document.getElementById("marksContainer");

                container.innerHTML = "";

                const subjects = [

                    ["Botany", data.botany],
                    ["Zoology", data.zoology],
                    ["Mathematics", data.mathematics],
                    ["Physics", data.physics],
                    ["Chemistry", data.chemistry],
                    ["Computer Science", data.computer_science],
                    ["Informatics Practices", data.informatics_practices],
                    ["Accountancy", data.accountancy],
                    ["Business Studies", data.business_studies],
                    ["Economics", data.economics]

                ];

                subjects.forEach(subject => {

                    if (subject[1] !== null) {

                        const row = document.createElement("div");

                        row.className = "marks-row";

                        row.innerHTML = `
            <span class="subject">${subject[0]}</span>
            <span class="mark">${subject[1]}</span>
        `;

                        container.appendChild(row);

                    }

                });

            }

            catch (err) {

                console.error(err);

            }

        }

        document.getElementById("logoutBtn")
            .addEventListener("click", () => {

                localStorage.removeItem("studentId");

                window.location.href = "login.html";

            });

        loadResult();

    </script>
    <script src="js/theme.js"></script>
</body>

</html>
