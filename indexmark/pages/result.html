<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <div class="brand">

            <h1>Index Mark Calculator</h1>

            <p>Your Result</p>

        </div>

        <div class="card">

            <h2 id="studentName">Loading...</h2>

            <p id="studentStream"></p>

            <hr>

            <div id="marksContainer">

            </div>

            <hr>

            <h2 id="indexMark">

            </h2>

            <br>

            <button id="logoutBtn" class="btn btn-secondary">
                Logout
            </button>

            <a href="index.html" class="btn btn-ghost">
                Home
            </a>

        </div>

    </div>

    <script>

        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
            window.location.href = "login.html";
        }

        async function loadResult() {

            try {

                const res = await fetch(`/result/${studentId}`);

                const data = await res.json();

                if (!res.ok) {

                    alert(data.message);

                    return;

                }

                document.getElementById("studentName").textContent =
                    data.name;

                document.getElementById("studentStream").textContent =
                    "Stream : " + data.stream;

                document.getElementById("indexMark").textContent =
                    "Index Mark : " + Number(data.index_mark).toFixed(2);

                const container =
                    document.getElementById("marksContainer");

                container.innerHTML = "";

                const subjects = [

                    ["Botany", data.botany],
                    ["Zoology", data.zoology],
                    ["Mathematics", data.mathematics],
                    ["Physics", data.physics],
                    ["Chemistry", data.chemistry],
                    ["Computer Science", data.computer_science],
                    ["Informatics Practices", data.informatics_practices],
                    ["Accountancy", data.accountancy],
                    ["Business Studies", data.business_studies],
                    ["Economics", data.economics]

                ];

                subjects.forEach(subject => {

                    if (subject[1] !== null) {

                        const p = document.createElement("p");

                        p.textContent =
                            `${subject[0]} : ${subject[1]}`;

                        container.appendChild(p);

                    }

                });

            }

            catch (err) {

                console.error(err);

            }

        }

        document.getElementById("logoutBtn")
            .addEventListener("click", () => {

                localStorage.removeItem("studentId");

                window.location.href = "login.html";

            });

        loadResult();

    </script>

</body>

</html>
