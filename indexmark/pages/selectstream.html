<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Stream — Index Mark Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script>
        const theme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">
        <div class="brand">
            <h1>Index Mark Calculator</h1>
            <p>Which stream did you study in Plus Two?</p>
        </div>

        <div class="card">
            <h2 class="card-title">Select Your Stream</h2>

            <div class="stream-options">

                <label class="stream-option">
                    <input type="radio" name="stream" value="biomaths">
                    <span>Biomaths</span>
                </label>

                <label class="stream-option">
                    <input type="radio" name="stream" value="computer_science">
                    <span>Computer Science</span>
                </label>

                <label class="stream-option">
                    <input type="radio" name="stream" value="ip">
                    <span>Informatics Practices (IP)</span>
                </label>

            </div>

            <div id="errorMsg" class="error-msg"></div>

            <button id="continueBtn" class="btn btn-primary" disabled>Continue</button>
            <a class="btn btn-ghost" href="index.html">Home</a>
        </div>
    </div>

    <!--     <script src="js/config.js"></script>-->
    <script>
        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
            window.location.href = "login.html";
        }

        let selectedStream = null;
        const options = document.querySelectorAll(".stream-option");
        options.forEach(opt => {
            opt.addEventListener("click", () => {
                options.forEach(o => o.classList.remove("selected"));
                opt.classList.add("selected");
                selectedStream = opt.dataset.stream;
                document.getElementById("continueBtn").disabled = false;
            });
        });

        document.getElementById("continueBtn").addEventListener("click", async () => {
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.classList.remove("show");

            try {
                const res = await fetch(`/submit-stream`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ studentId: studentId, stream: selectedStream })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.textContent = data.message || "Could not save stream.";
                    errorMsg.classList.add("show");
                    return;
                }

                window.location.href = "entermarks.html";
            } catch (err) {
                errorMsg.textContent = "Could not reach the server. Is the backend running?";
                errorMsg.classList.add("show");
            }
        });
    </script>
    <script src="js/theme.js"></script>
</body>

</html>
