<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Marks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="brand">
            <h1>Index Mark Calculator</h1>
            <p id="streamLabel">Loading...</p>
        </div>

        <div class="card">

            <h2>Enter Marks</h2>

            <form id="marksForm">

                <div id="subjectFields"></div>

                <br>

                <button type="button" id="changeStreamBtn" class="btn btn-secondary">
                    Change Stream
                </button>

                <br><br>

                <button class="btn btn-primary" type="submit">
                    Submit
                </button>

            </form>

        </div>

    </div>

    <script>

        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
            window.location.href = "login.html";
        }


        async function checkExistingMarks() {

            const res = await fetch(`/has-marks/${studentId}`);

            const data = await res.json();

            if (data.hasMarks) {
                window.location.href = "result.html";
            }

        }

        checkExistingMarks();


        const SUBJECTS = {

            "Biomaths": [
                "Botany",
                "Zoology",
                "Mathematics",
                "Physics",
                "Chemistry"
            ],

            "Computer Science": [
                "Mathematics",
                "Physics",
                "Chemistry",
                "Computer Science"
            ],

            "IP": [
                "Informatics Practices",
                "Accountancy",
                "Business Studies",
                "Economics"
            ]

        };

        async function loadSubjects() {

            const res = await fetch(`/student/${studentId}`);

            const student = await res.json();

            document.getElementById("streamLabel").textContent =
                `Stream : ${student.stream}`;

            const subjects = SUBJECTS[student.stream];

            const container = document.getElementById("subjectFields");

            container.innerHTML = "";

            subjects.forEach(subject => {

                const label = document.createElement("label");
                label.textContent = subject;

                const input = document.createElement("input");

                input.type = "number";
                const dbNames = {
                    "Botany": "botany",
                    "Zoology": "zoology",
                    "Mathematics": "mathematics",
                    "Physics": "physics",
                    "Chemistry": "chemistry",
                    "Computer Science": "computer_science",
                    "Informatics Practices": "informatics_practices",
                    "Accountancy": "accountancy",
                    "Business Studies": "business_studies",
                    "Economics": "economics"
                };

                input.name = dbNames[subject];
                input.min = 0;
                input.max = 100;
                input.required = true;

                container.appendChild(label);
                container.appendChild(input);

                container.appendChild(document.createElement("br"));
                container.appendChild(document.createElement("br"));

            });

        }

        loadSubjects();

        document.getElementById("changeStreamBtn").addEventListener("click", () => {

            window.location.href = "selectstream.html";

        });

        document.getElementById("marksForm").addEventListener("submit", async (e) => {

            e.preventDefault();

            const inputs = document.querySelectorAll("#subjectFields input");

            const marks = {};

            inputs.forEach(input => {
                marks[input.name] = Number(input.value);
            });

            try {

                const res = await fetch("/submit-marks", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        studentId,
                        marks
                    })

                });

                const data = await res.json();

                window.location.href = "result.html";

            } catch (err) {

                console.error(err);

            }

        });
    </script>

</body>

</html>
